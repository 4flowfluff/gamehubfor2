<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Spel - Flerspelare</title>
    <!-- Vi laddar in PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #181a20; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 0; overflow: hidden; }
        #menu { background: #23272a; max-width: 400px; margin: 40px auto; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input, button { padding: 12px; margin: 8px 0; width: 85%; border-radius: 6px; border: 1px solid #444; background: #2c2f33; color: #fff; font-size: 16px; }
        button { background: #7289da; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #5b6eae; }
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
        #canvas-wrapper { width: 100%; height: calc(100vh - 60px); display: flex; justify-content: center; align-items: center; background: #2f3136; }
        canvas { background: #2f3136; display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
        #chat-box { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 600px; display: flex; gap: 8px; }
        #chat-input { flex: 1; margin: 0; }
        #chat-btn { width: 90px; margin: 0; }
        #room-id-input { font-size: 20px; letter-spacing: 2px; text-align: center; font-weight: bold; }
        #room-info { position: absolute; top: 10px; left: 10px; margin: 0; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

    <!-- MENY FÖR ATT STARTA / GÅ MED -->
    <div id="menu">
        <h2>Skapa eller Gå med i Rum</h2>
        <input type="text" id="username" placeholder="Ditt användarnamn" value="Spelare"><br>
        <input type="color" id="usercolor" value="#7289da" style="width: 85%; height: 40px; border: none; cursor: pointer;"><br>
        <button onclick="createRoom()">Skapa nytt rum</button>
        <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
        <input type="number" id="room-id-input" placeholder="t.ex. 7356" maxlength="4">
        <button onclick="joinRoom()">Gå med i rum</button>
        <p id="status" style="font-size: 14px; color: #aaa;"></p>
    </div>

    <!-- SPELVYN (FULLSKÄRM) -->
    <div id="game-container">
        <div id="room-info">Rum: <span id="my-id" style="color: #7289da; font-weight: bold;">-</span></div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        <div id="chat-box">
            <input type="text" id="chat-input" placeholder="Skriv meddelande..." onkeydown="checkSend(event)">
            <button id="chat-btn" onclick="sendMessage()">Skicka</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let peer = null;
    let conn = null;
    let myId = '';
    let isHost = false;

    let myData = {
        id: '',
        name: 'Spelare',
        x: 400,
        y: 300,
        targetX: 400,
        targetY: 300,
        color: '#7289da',
        message: '',
        msgTimer: 0
    };

    let otherPlayers = {};

    function generateShortCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    function createRoom() {
        initPlayerInfo();
        const shortId = generateShortCode();
        
        peer = new Peer(shortId, { secure: true, port: 443 });
        
        peer.on('open', (id) => {
            myId = id;
            myData.id = id;
            isHost = true;
            document.getElementById('my-id').innerText = id;
            startMenuToGame();
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') createRoom();
            else alert("Kunde inte ansluta: " + err.type);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });
    }

    function joinRoom() {
        const targetId = document.getElementById('room-id-input').value.trim();
        if(!targetId) { alert("Skriv in en rumskod!"); return; }
        
        initPlayerInfo();
        peer = new Peer({ secure: true, port: 443 });

        peer.on('open', (id) => {
            myId = id;
            myData.id = id;
            isHost = false;
            document.getElementById('my-id').innerText = targetId;
            
            conn = peer.connect(targetId);
            setupConnection();
            startMenuToGame();
        });

        peer.on('error', (err) => {
            alert("Hittade inte rummet: " + err.type);
        });
    }

    function initPlayerInfo() {
        myData.name = document.getElementById('username').value || 'Anonym';
        myData.color = document.getElementById('usercolor').value;
    }

    function startMenuToGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        requestAnimationFrame(gameLoop);
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('status').innerText = "Ansluten!";
            sendData({ type: 'JOIN', player: myData });
        });

        conn.on('data', (data) => {
            handleNetworkData(data);
        });
    }

    function sendData(data) {
        if(conn && conn.open) conn.send(data);
    }

    function handleNetworkData(data) {
        if(data.type === 'JOIN' || data.type === 'UPDATE') {
            otherPlayers[data.player.id] = data.player;
            if(data.type === 'JOIN' && isHost) {
                sendData({ type: 'UPDATE', player: myData });
            }
        } else if(data.type === 'CHAT') {
            if(!otherPlayers[data.player.id]) {
                otherPlayers[data.player.id] = data.player;
            }
            otherPlayers[data.player.id].message = data.msg;
            otherPlayers[data.player.id].msgTimer = 300;
        }
    }

    // Exakt koordinatberäkning för både mus och mobil-touch
    function handleInput(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        myData.targetX = (clientX - rect.left) * scaleX;
        myData.targetY = (clientY - rect.top) * scaleY;
    }

    canvas.addEventListener('click', (e) => {
        handleInput(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY);
        e.preventDefault();
    }, { passive: false });

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if(!msg) return;

        myData.message = msg;
        myData.msgTimer = 300;
        input.value = '';

        sendData({ type: 'CHAT', player: myData, msg: msg });
    }

    function checkSend(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function gameLoop() {
        let dx = myData.targetX - myData.x;
        let dy = myData.targetY - myData.y;
        if(Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            myData.x += dx * 0.1;
            myData.y += dy * 0.1;
            sendData({ type: 'UPDATE', player: myData });
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Rutnät i Habbo-stil
        ctx.strokeStyle = '#36393f';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for(let j=0; j<canvas.height; j+=40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        drawAvatar(myData);

        for(let id in otherPlayers) {
            let p = otherPlayers[id];
            let pdx = p.targetX - p.x;
            let pdy = p.targetY - p.y;
            p.x += pdx * 0.1;
            p.y += pdy * 0.1;
            drawAvatar(p);
        }

        requestAnimationFrame(gameLoop);
    }

    function drawAvatar(p) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(p.x, p.y + 15, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 10, p.y - 10, 20, 25);

        ctx.fillStyle = '#ffdbac';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 18, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 32);

        if(p.msgTimer > 0) {
            p.msgTimer--;
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            
            let textWidth = ctx.measureText(p.message).width;
            let boxWidth = Math.max(textWidth + 20, 40);
            
            ctx.beginPath();
            ctx.roundRect(p.x - boxWidth/2, p.y - 75, boxWidth, 30, 6);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.fillText(p.message, p.x, p.y - 55);
        }
    }
</script>

</body>
</html>
